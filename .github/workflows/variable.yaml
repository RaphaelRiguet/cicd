name: Needs et Outputs
on:
  push:
    branches:
      - main
      - develop
      - feature/*
jobs:
  code-quality:
    runs-on: ubuntu-latest
    outputs:
      code-quality-version: ${{ steps.quality-code-version.outputs.code-quality-version }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Verifier la qualité du code
        run: echo "Vérification de la qualité du code"
      - name: quality code version
        id: quality-code-version
        run: echo "code-quality-version=1.0.0" >> $GITHUB_OUTPUT
      - name: Linting du code
        run: echo "Linting du code"
      - name: Afficher la version de la qualité du code
        run: echo La version de la qualité du code ${{steps.quality-code-version.outputs.code-quality-version}}

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Analyse statique du code
        run: echo "Analyse statique du code"
  test:
    needs: [code-quality, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Exécuter les tests
        run: echo "Exécution des tests"
      - name: Afficher la version de la qualité du code
        run: echo La version de la qualité du code ${{ needs.code-quality.outputs.code-quality-version }}
  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Construire le projet
        run: echo "Construction du projet"

name: gestion de branche
on:
  push:
    branches:
      - main
jobs: 
  cache:
  runs-on: ubuntu-latest
  steps:
  name: Récupérer le dépôt
  uses: actions/checkout@v7
  mise en cache des dependance
  use: actions/cache@v6
  key ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
restore-keys: |
  ${{ runner.os }}-node-
  ${{ runner.os }}-
  - name: Installer les dépendances
    run: npm ci
  
