name: les variables
on:
  push:
    branches:
      - main
      -develop
env:
  MA_VARIABLE: variable dans le workflow
  autre_varible: une autre valeur globale

jobs:
  variable-et-contexte:
    env:
    JOB_VARIABLE: variable dans le job
    runs-on: ubuntu-latest
    steps:
    -name: Récupérer le dépôt
     uses: actions/checkout@v7
     -name: Lister les variables par defaut
      run: env
      name: lister les variable d'environnement du job
      env:
        STEP_VARIABLE: variable dans l'étape
      run: |
        echo "-----variables github------"
        echo $GITHUB_REF
        echo $GITHUB_SHA
        echo ${{runer.os}}
        
